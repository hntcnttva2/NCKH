<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang tin tức</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="Logo Trường Đại Học GTVT">
                <p>Đại Học Giao Thông Vận Tải</p>
            </div>
            <nav>
                <ul>
                    <li>🏠 Trang chủ</li>
                    <li>📝 Lịch học</li>
                    <li>📅 Điểm danh</li>
                </ul>
            </nav>
        </aside>
        

        <main class="content" id="main-content">
            <header>
                <div class="search-container">
                    <input type="text" class="search-bar" placeholder="Tìm kiếm thông tin...">
                    <i class="search-icon">🔍</i>
                </div>                
                <div class="user">Hồ Thị Ngọc Tú</div>
            </header>
            <div id="content-area">
                <h2>Chào mừng đến với Trang chủ</h2>
                <p>Chọn một mục từ menu để xem nội dung.</p>
            </div>
        </main>        
    </div>
</body>
</html>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    // Lấy danh sách các mục menu
    const menuItems = document.querySelectorAll(".sidebar nav ul li");
    
    // Lấy phần hiển thị nội dung chính
    const mainContent = document.getElementById("content-area");

    // Hàm loại bỏ class "active" khỏi tất cả các mục menu
    function removeActiveClass() {
        menuItems.forEach(item => item.classList.remove("active"));
    }

    // Xử lý khi click vào "Lịch học"
    menuItems[1].addEventListener("click", function () {
        removeActiveClass(); // Xóa class active cũ
        this.classList.add("active"); // Thêm class active vào mục được chọn
        
        mainContent.innerHTML = `
            <h2>📅 Lịch học của bạn</h2>
            <ul>
                <li>📖 Toán - Thứ 2, 08:00 - 10:00</li>
                <li>🔬 Vật lý - Thứ 3, 09:00 - 11:00</li>
                <li>💻 Lập trình - Thứ 5, 13:00 - 15:00</li>
            </ul>
        `;
    });

    // Xử lý khi click vào "Trang chủ"
    menuItems[0].addEventListener("click", function () {
        removeActiveClass();
        this.classList.add("active");

        mainContent.innerHTML = `
            <h2>Chào mừng đến với Trang chủ</h2>
            <p>Chọn một mục từ menu để xem nội dung.</p>
        `;
    });

    // Xử lý khi click vào "Điểm danh"
    menuItems[2].addEventListener("click", function () {
        removeActiveClass();
        this.classList.add("active");

        mainContent.innerHTML = `
            <h2>📝 Điểm danh</h2>
            <p>Chức năng điểm danh đang phát triển.</p>
        `;
    });
});
    </script>
